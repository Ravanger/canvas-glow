<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="1000" height="750" fill="#ffffff"/>

  <line x1="20" y1="40" x2="980" y2="40" stroke="#d62828" stroke-width="5"/>
  <line x1="20" y1="70" x2="980" y2="70" stroke="#1d4ed8" stroke-width="5"/>
  <line x1="20" y1="710" x2="980" y2="710" stroke="#1d4ed8" stroke-width="5"/>
  <path d="M976 70 V710" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="8 6" fill="none"/>
  <text x="44" y="30" fill="#d62828" font-weight="bold">+5 V rail (load only)</text>
  <text x="44" y="90" fill="#1d4ed8" font-weight="bold">GND rail</text>
  <text x="44" y="734" fill="#1d4ed8" font-weight="bold">GND rail</text>
  <text x="966" y="400" fill="#1d4ed8" text-anchor="middle" transform="rotate(-90 966 400)">jumper: join both GND rails</text>

  <rect x="868" y="100" width="96" height="44" rx="6" fill="#444"/>
  <text x="916" y="127" fill="#fff" text-anchor="middle">5 V 2 A jack</text>
  <line x1="890" y1="100" x2="890" y2="40" stroke="#d62828" stroke-width="3"/>
  <line x1="946" y1="100" x2="946" y2="70" stroke="#1d4ed8" stroke-width="3"/>
  <text x="878" y="94" fill="#d62828" font-weight="bold">+</text>
  <text x="952" y="94" fill="#1d4ed8" font-weight="bold">−</text>

  <g stroke="#222" stroke-width="2.5" fill="none">
    <line x1="820" y1="40" x2="820" y2="51"/>
    <line x1="808" y1="51" x2="832" y2="51" stroke-width="3"/>
    <path d="M808 61 Q820 55 832 61" stroke-width="3"/>
    <line x1="820" y1="58" x2="820" y2="70"/>
  </g>
  <text x="880" y="164" text-anchor="middle" font-size="12">470–1000 µF across the rails</text>
  <text x="880" y="179" text-anchor="middle" font-size="12">stripe (−) to GND</text>

  <rect x="470" y="148" width="60" height="28" rx="4" fill="#b8bec9"/>
  <text x="500" y="140" text-anchor="middle">USB-C → PC</text>
  <rect x="430" y="170" width="140" height="330" rx="8" fill="#1f2a44"/>
  <rect x="484" y="300" width="32" height="70" rx="3" fill="#3a4766"/>
  <text x="500" y="340" fill="#cfd6e6" font-size="11" text-anchor="middle">C3</text>
  <text x="500" y="520" text-anchor="middle" font-weight="bold">ESP32-C3 SuperMini</text>

  <g fill="#e0b040">
    <circle cx="442" cy="210" r="5"/><circle cx="442" cy="248" r="5"/><circle cx="442" cy="286" r="5"/><circle cx="442" cy="324" r="5"/>
    <circle cx="442" cy="362" r="5"/><circle cx="442" cy="400" r="5"/><circle cx="442" cy="438" r="5"/><circle cx="442" cy="476" r="5"/>
    <circle cx="558" cy="210" r="5"/><circle cx="558" cy="248" r="5"/><circle cx="558" cy="286" r="5"/><circle cx="558" cy="324" r="5"/>
    <circle cx="558" cy="362" r="5"/><circle cx="558" cy="400" r="5"/><circle cx="558" cy="438" r="5"/><circle cx="558" cy="476" r="5"/>
  </g>
  <g fill="#ffffff" font-size="12">
    <text x="454" y="214">5V</text><text x="454" y="252">GND</text><text x="454" y="290">3V3</text><text x="454" y="328">4</text>
    <text x="454" y="366">3</text><text x="454" y="404" fill="#8a93a6">2</text><text x="454" y="442">1</text><text x="454" y="480">0</text>
  </g>
  <g fill="#ffffff" font-size="12" text-anchor="end">
    <text x="546" y="214">5</text><text x="546" y="252">6</text><text x="546" y="290">7</text><text x="546" y="328" fill="#8a93a6">8</text>
    <text x="546" y="366" fill="#8a93a6">9</text><text x="546" y="404">10</text><text x="546" y="442">20</text><text x="546" y="480">21</text>
  </g>

  <line x1="442" y1="210" x2="418" y2="210" stroke="#888" stroke-width="2"/>
  <g stroke="#d62828" stroke-width="3"><line x1="411" y1="203" x2="425" y2="217"/><line x1="411" y1="217" x2="425" y2="203"/></g>

  <g fill="none" stroke-width="2.5" stroke-linejoin="round">
    <path d="M442 248 H405 V70" stroke="#222"/>
    <path d="M442 286 H395 V520" stroke="#7b2cbf"/>
    <path d="M395 566 V585" stroke="#7b2cbf"/>
    <path d="M395 665 V710" stroke="#222"/>
    <path d="M442 438 H330 V625 H371" stroke="#7b2cbf"/>
    <path d="M350 625 V660 M350 666 V710" stroke="#222"/>
    <path d="M442 362 H350 M300 362 H215" stroke="#e07a00"/>
    <path d="M260 362 V440 M260 486 V710" stroke="#222"/>
    <path d="M215 354 L195 338 V306" stroke="#222"/>
    <path d="M215 370 L195 386 V710" stroke="#222"/>
    <path d="M40 299 H28 V40" stroke="#d62828"/>
  </g>

  <rect x="388" y="520" width="14" height="46" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="380" y="548" text-anchor="end">1 MΩ</text>
  <rect x="385" y="585" width="20" height="80" fill="#fff" stroke="#222" stroke-width="2"/>
  <polygon points="371,619 384,625 371,631" fill="#7b2cbf"/>
  <text x="380" y="600" text-anchor="end">A</text>
  <text x="380" y="662" text-anchor="end">B</text>
  <text x="414" y="612">knob B500K</text>
  <text x="414" y="629" font-size="12">wiper → GPIO1</text>
  <g stroke="#222" stroke-width="3"><line x1="338" y1="660" x2="362" y2="660"/><line x1="338" y1="666" x2="362" y2="666"/></g>
  <text x="332" y="668" text-anchor="end">100 nF</text>

  <rect x="300" y="355" width="50" height="14" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="325" y="348" text-anchor="middle">100 Ω</text>
  <circle cx="205" cy="362" r="24" fill="none" stroke="#222" stroke-width="2"/>
  <line x1="215" y1="347" x2="215" y2="377" stroke="#222" stroke-width="3.5"/>
  <polygon points="195,386 199,375 205,383" fill="#222"/>
  <text x="182" y="336" text-anchor="end" font-size="12">C</text>
  <text x="224" y="356" font-size="12">B</text>
  <text x="182" y="400" text-anchor="end" font-size="12">E</text>
  <text x="170" y="366" text-anchor="end" font-weight="bold">BC337</text>
  <rect x="253" y="440" width="14" height="46" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="274" y="468">10 kΩ</text>
  <rect x="40" y="292" width="155" height="14" rx="2" fill="#ffd166" stroke="#b08900"/>
  <text x="44" y="286" fill="#d62828" font-weight="bold">+</text>
  <text x="182" y="286" font-weight="bold">−</text>
  <text x="112" y="324" text-anchor="middle" font-size="12">COB strip piece, 10–20 cm</text>

  <rect x="40" y="118" width="300" height="146" rx="8" fill="#f7f7f9" stroke="#ccc"/>
  <text x="54" y="140" font-weight="bold">or a plain LED instead of the strip</text>
  <text x="54" y="204" fill="#d62828" font-weight="bold">+ rail</text>
  <g fill="none" stroke-width="2.5">
    <path d="M100 200 H150" stroke="#d62828"/>
    <path d="M200 200 H240 M262 200 H292" stroke="#222"/>
    <line x1="262" y1="188" x2="262" y2="212" stroke="#222" stroke-width="3"/>
    <path d="M246 182 L254 172 M256 186 L264 176" stroke="#e0a000" stroke-width="2"/>
  </g>
  <rect x="150" y="193" width="50" height="14" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="175" y="186" text-anchor="middle">220 Ω</text>
  <polygon points="240,188 240,212 262,200" fill="#222"/>
  <text x="298" y="204">to C</text>
  <text x="190" y="234" text-anchor="middle" font-size="12">anode = long leg, cathode = short leg</text>
  <text x="190" y="250" text-anchor="middle" font-size="12">(flat side) towards C · about 13 mA</text>

  <g fill="#222">
    <circle cx="405" cy="70" r="4"/><circle cx="28" cy="40" r="4"/><circle cx="890" cy="40" r="4"/><circle cx="946" cy="70" r="4"/>
    <circle cx="820" cy="40" r="4"/><circle cx="820" cy="70" r="4"/>
    <circle cx="260" cy="362" r="4"/><circle cx="350" cy="625" r="4"/>
    <circle cx="395" cy="710" r="4"/><circle cx="350" cy="710" r="4"/><circle cx="260" cy="710" r="4"/><circle cx="195" cy="710" r="4"/>
    <circle cx="976" cy="70" r="4"/><circle cx="976" cy="710" r="4"/>
  </g>

  <g font-size="12" fill="#333">
    <text x="560" y="600">● = joined · crossing without ● = not joined</text>
    <text x="560" y="620">✕ = leave unconnected (5V pin: board runs on USB)</text>
    <text x="560" y="640">grey pins: avoid (boot pins)</text>
    <text x="560" y="660">pin positions vary: go by the silkscreen labels</text>
  </g>
</svg>

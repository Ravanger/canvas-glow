  <use href="#gnd" x="720" y="300"/>
  <text x="790" y="290" font-size="12">mode switch,</text>
  <text x="790" y="305" font-size="12">latched = NIGHT</text>

  <rect x="393" y="560" width="14" height="46" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="386" y="588" text-anchor="end">1 MΩ</text>
  <rect x="390" y="620" width="20" height="70" fill="#fff" stroke="#222" stroke-width="2"/>
  <polygon points="376,649 389,655 376,661" fill="#7b2cbf"/>
  <text x="386" y="632" text-anchor="end" font-size="12">A</text>
  <text x="386" y="690" text-anchor="end" font-size="12">B</text>
  <text x="318" y="610" text-anchor="end">knob B500K</text>
  <text x="318" y="627" text-anchor="end" font-size="12">wiper → GPIO1</text>
  <use href="#gnd" x="400" y="705"/>
  <g stroke="#222" stroke-width="3"><line x1="338" y1="680" x2="362" y2="680"/><line x1="338" y1="686" x2="362" y2="686"/></g>
  <text x="332" y="688" text-anchor="end">100 nF</text>
  <use href="#gnd" x="350" y="700"/>

  <rect x="463" y="712" width="14" height="40" fill="#fff" stroke="#222" stroke-width="2"/>

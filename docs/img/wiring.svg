      <line x1="-10" y1="0" x2="10" y2="0"/><line x1="-6" y1="4" x2="6" y2="4"/><line x1="-2" y1="8" x2="2" y2="8"/>
    </g>
  </defs>

  <rect x="30" y="50" width="110" height="50" rx="6" fill="#444"/>

  <circle cx="706" cy="700" r="6" fill="#fff" stroke="#555" stroke-width="2.5"/>
  <rect x="712" y="696" width="230" height="8" rx="3" fill="#c0c4cc" stroke="#888"/>
  <circle cx="944" cy="700" r="5" fill="#c0c4cc" stroke="#888"/>

  <g stroke="#222" stroke-width="2.5" fill="none">
    <line x1="170" y1="62" x2="170" y2="71"/>
    <line x1="158" y1="71" x2="182" y2="71" stroke-width="3"/>
    <path d="M158 80 Q170 74 182 80" stroke-width="3"/>
    <line x1="170" y1="77" x2="170" y2="88"/>
  </g>
  <text x="85" y="124" text-anchor="middle" font-size="12">470–1000 µF at the jack,</text>
  <text x="85" y="139" text-anchor="middle" font-size="12">stripe (−) to GND</text>

  <path d="M300 62 V110 M300 130 V180 H405 V210 H442" stroke="#d62828" stroke-width="2.5" fill="none" stroke-linejoin="round"/>

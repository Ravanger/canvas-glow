    <path d="M442 324 H380 M220 324 H190 M442 362 H380 M220 362 H190" stroke="#e07a00"/>
    <path d="M558 210 H600 M770 210 H800 M558 400 H600 M770 400 H800" stroke="#e07a00"/>

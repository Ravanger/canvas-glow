  <text x="827" y="724" text-anchor="middle" font-size="12">lead under 30 cm, at least 2 cm from strip wires</text>

  <rect x="590" y="440" width="390" height="200" rx="8" fill="#f7f7f9" stroke="#ccc"/>
  <text x="605" y="464" font-weight="bold">One driver channel (build 4)</text>
  <text x="605" y="500" fill="#d62828" font-weight="bold">+5 V</text>
  <g fill="none" stroke-width="2.5" stroke-linejoin="round">
    <path d="M644 496 H700" stroke="#d62828"/>
    <path d="M820 496 H905 V536 L885 552" stroke="#222"/>
    <path d="M885 568 L905 584 V615" stroke="#222"/>
    <path d="M644 560 H680 M730 560 H885" stroke="#e07a00"/>
    <path d="M800 560 V572 M800 608 V615" stroke="#222"/>
  </g>

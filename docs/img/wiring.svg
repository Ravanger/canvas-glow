  <path d="M140 62 H980" stroke="#d62828" stroke-width="5" fill="none"/>
  <text x="640" y="50" fill="#d62828" font-weight="bold" text-anchor="middle">+5 V strip rail → COB + of all 4 segments</text>
  <path d="M140 88 H200" stroke="#222" stroke-width="3" fill="none"/>
  <circle cx="200" cy="88" r="7" fill="#222"/>

  <circle cx="897" cy="560" r="24" fill="none" stroke="#222" stroke-width="2"/>
  <line x1="885" y1="545" x2="885" y2="575" stroke="#222" stroke-width="3.5"/>
  <polygon points="905,584 893,581 900,573" fill="#222"/>
  <text x="912" y="532" font-size="12">C</text>
  <text x="872" y="552" text-anchor="end" font-size="12">B</text>
  <text x="912" y="600" font-size="12">E</text>
  <text x="928" y="565" font-weight="bold">BC337</text>
  <text x="605" y="564">GPIO</text>
  <rect x="680" y="553" width="50" height="14" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="705" y="547" text-anchor="middle" font-size="12">100 / 150 Ω</text>
  <circle cx="800" cy="560" r="4" fill="#222"/>
  <rect x="793" y="572" width="14" height="36" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="812" y="596" font-size="12">10 kΩ</text>
  <use href="#gnd" x="800" y="615"/><use href="#gnd" x="905" y="615"/>

  <g fill="#222">
    <circle cx="170" cy="62" r="4"/><circle cx="170" cy="88" r="4"/><circle cx="300" cy="62" r="4"/>
    <circle cx="330" cy="180" r="4"/><circle cx="380" cy="180" r="4"/><circle cx="350" cy="655" r="4"/><circle cx="470" cy="700" r="4"/>
  </g>

  <g font-size="12" fill="#333">
    <text x="24" y="430">⏚ = own wire back to the star point</text>
    <text x="24" y="448">● = joined · crossing without ● = not joined</text>
    <text x="24" y="466">every segment's + goes to the +5 V rail</text>
    <text x="24" y="484">grey pins: avoid (boot pins)</text>
    <text x="24" y="502">pin positions vary: go by the silkscreen</text>
  </g>

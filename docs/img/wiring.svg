  <text x="500" y="522" text-anchor="middle" font-weight="bold">ESP32-C3 SuperMini</text>

  <g fill="#e0b040">
    <circle cx="442" cy="210" r="5"/><circle cx="442" cy="248" r="5"/><circle cx="442" cy="286" r="5"/><circle cx="442" cy="324" r="5"/>
    <circle cx="442" cy="362" r="5"/><circle cx="442" cy="400" r="5"/><circle cx="442" cy="438" r="5"/><circle cx="442" cy="476" r="5"/>
    <circle cx="558" cy="210" r="5"/><circle cx="558" cy="248" r="5"/><circle cx="558" cy="286" r="5"/><circle cx="558" cy="324" r="5"/>
    <circle cx="558" cy="362" r="5"/><circle cx="558" cy="400" r="5"/><circle cx="558" cy="438" r="5"/><circle cx="558" cy="476" r="5"/>
  </g>

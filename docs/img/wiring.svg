    <line x1="318" y1="194" x2="342" y2="194" stroke-width="3"/>
    <path d="M318 203 Q330 197 342 203" stroke-width="3"/>
    <path d="M380 180 V194 M380 200 V212"/>
    <line x1="368" y1="194" x2="392" y2="194" stroke-width="3"/>
    <line x1="368" y1="200" x2="392" y2="200" stroke-width="3"/>

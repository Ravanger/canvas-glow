    <rect x="800" y="393" width="170" height="14" rx="2" fill="#ffd166" stroke="#b08900"/>
    <text x="885" y="404" font-size="11">short side, 24 cm</text>
  </g>

  <text x="606" y="252" fill="#8a93a6" font-size="12">spare: 2nd sensor + its own 1 MΩ</text>
